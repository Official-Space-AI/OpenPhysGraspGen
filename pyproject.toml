[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "physgraspgen"
version = "0.1.0b0"
description = "Physics-labelled grasp data generation for deformable objects"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SpaceAI" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["robotics", "grasping", "deformable", "simulation", "hyperelasticity", "dataset"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.1"]
dataset = ["pyarrow>=17", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/Official-Space-AI/OpenPhysGraspGen"
Issues = "https://github.com/Official-Space-AI/OpenPhysGraspGen/issues"

[project.scripts]
physgraspgen = "physgraspgen.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
