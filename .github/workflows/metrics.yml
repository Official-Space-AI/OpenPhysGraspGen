name: Monthly metrics

# On the 1st of each month, collect last month's metrics with the versioned script
# and publish them in the job summary and as an artifact. A maintainer adds the row
# to docs/metrics/kpi.csv in the monthly review pull request.

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to collect (YYYY-MM); last month when empty"
        required: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONTH: ${{ inputs.month }}
        run: |
          month="${MONTH:-$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)}"
          cp docs/metrics/kpi.csv kpi.csv
          python scripts/collect_metrics.py "$month" --csv kpi.csv
          {
            echo "### Metrics for $month"
            echo
            echo '```'
            cat kpi.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kpi
          path: kpi.csv
