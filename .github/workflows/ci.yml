name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-oldest:
    # The oldest versions the dataset check accepts, beside a Python it refuses. Python
    # 3.9 has no build for Ubuntu images newer than 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.9
            3.10
      - run: pip install -e ".[dev,dataset]" numpy==1.26.4 pyarrow==23.0.1 pyyaml==6.0.1
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "reuse[charset-normalizer]==6.2.0"
      - run: reuse lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # The 3.12 job runs the tests that encode and decode AV1 with a real ffmpeg, and
      # fails them rather than skip them when it cannot.
      REQUIRE_AV1: ${{ matrix.python-version == '3.12' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        if: env.REQUIRE_AV1 == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check that ffmpeg has the SVT-AV1 encoder and the dav1d decoder
        if: env.REQUIRE_AV1 == '1'
        run: |
          ffmpeg -version
          dpkg-query -W 'libsvtav1enc*' 'libdav1d*'
          # The writer encodes with libsvtav1, and read_video decodes with ffmpeg's
          # default AV1 decoder, libdav1d.
          ffmpeg -hide_banner -encoders | grep -w libsvtav1
          ffmpeg -hide_banner -decoders | grep -w libdav1d
      - run: pip install -e ".[dev,dataset]"
      - run: pytest --cov=openphysgraspgen --cov-report=term-missing
      - name: CLI smoke test
        run: openphysgraspgen > /dev/null

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build==1.6.1
      - run: python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl pytest
      - name: Run the tests and the CLI against the installed wheel
        run: |
          "$RUNNER_TEMP/wheel-env/bin/python" -c "import openphysgraspgen; assert 'site-packages' in openphysgraspgen.__file__, openphysgraspgen.__file__"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pytest -p no:cacheprovider tests
          "$RUNNER_TEMP/wheel-env/bin/openphysgraspgen" > /dev/null
