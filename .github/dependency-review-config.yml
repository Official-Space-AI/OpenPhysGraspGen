# Pull request rules taken from the license classes in docs/oss/license-policy.md
# and the vulnerability rules in docs/oss/vulnerability-log.md. Change this file
# by pull request; the project lead approves the change.

license-check: true
vulnerability-check: true
fail-on-severity: high
fail-on-scopes:
  - runtime
  - development
show-openssf-scorecard: true

# The policy's "allowed" class. Conditional licenses are left out on purpose:
# a package under one passes only after its evaluation is approved and its
# purl is listed in allow-dependencies-licenses below.
allow-licenses:
  - 0BSD
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - CC0-1.0
  - ISC
  - MIT
  - MIT-CMU
  - PSF-2.0
  - Python-2.0
  - Unlicense
  - Zlib

# Packages approved under a conditional license, one purl each, with the date
# of the approved evaluation. None yet.
# allow-dependencies-licenses:
#   - pkg:pypi/example # approved YYYY-MM-DD
