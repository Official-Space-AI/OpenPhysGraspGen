name: Feature request
description: Propose a scoped change. For open-ended ideas, use Discussions → Ideas first.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Public API, inputs and outputs, physical units if relevant.
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement this?
      options: ["Yes", "With guidance", "No"]
